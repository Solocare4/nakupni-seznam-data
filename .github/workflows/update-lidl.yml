name: Update LIDL offers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lidl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update LIDL catalog
        run: npm run update:lidl
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data/lidlCatalog.json data/lidl-debug.json; then
            echo "LIDL catalog has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add data/lidlCatalog.json data/lidl-debug.json
          git commit -m "Update LIDL offers"
          git push
