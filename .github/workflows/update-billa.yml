name: Update BILLA offers

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  update-billa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update BILLA catalog
        run: npm run update:billa

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data/billaCatalog.json; then
            echo "BILLA catalog has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/billaCatalog.json
          git commit -m "Update BILLA offers"
          git push