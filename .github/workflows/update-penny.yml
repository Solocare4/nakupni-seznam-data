name: Update PENNY offers

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  update-penny:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update PENNY catalog
        run: npm run update:penny

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- data/pennyCatalog.json; then
            echo "PENNY catalog has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"

          git add data/pennyCatalog.json
          git commit -m "Update PENNY offers"
          git push